<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GVCN Pro</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#718096;--line:#e5eaf1;
  --pri:#2563eb;--pri2:#1d4ed8;--side:#10233f;--side2:#173457;--good:#0f9f6e;
  --warn:#d97706;--bad:#dc2626;--shadow:0 10px 28px rgba(15,35,65,.08);
  --radius:18px
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--side),#0c1b31);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:7px 8px 17px}
.brand-badge{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:900}
.brand h1{font-size:19px;margin:0}.brand small{opacity:.72}
.group{margin-top:12px}.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;padding:8px 10px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;color:#dce9f7;padding:11px 12px;border-radius:11px;text-align:left}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}
.nav .ico{width:22px;text-align:center}
.main{min-width:0}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar-left{display:flex;align-items:center;gap:11px}.hamb{display:none}
.topbar h2{margin:0;font-size:19px}
.class-select{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;min-width:150px}
.content{padding:22px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:flex;justify-content:space-between;gap:15px;align-items:center}.stat strong{font-size:27px}.stat .label{color:var(--muted);font-size:13px}
.hero{position:relative;border-radius:22px;overflow:hidden;background:#dbeafe;min-height:265px;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero img{display:block;width:100%;height:290px;object-fit:cover}
.hero-empty{height:265px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#eaf2ff,#f8fbff)}
.hero-overlay{position:absolute;left:0;right:0;bottom:0;padding:24px;color:#fff;background:linear-gradient(transparent,rgba(8,28,52,.84))}
.hero-title{font-size:29px;font-weight:900}.hero-sub{opacity:.9;margin-top:4px}
.hero-actions{position:absolute;right:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--text)}
.btn:hover{background:#f8fafc}.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri2)}
.btn.good{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.btn.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.btn.sm{padding:6px 9px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}.section-head h3{margin:0}.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:#526071;font-weight:700}
input,select,textarea{width:100%;border:1px solid #d8e0ea;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text)}
textarea{min-height:95px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#607086;background:#f8fafc;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:35px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}
.badge.good{background:#ecfdf5;color:#047857}.badge.bad{background:#fef2f2;color:#b91c1c}.badge.warn{background:#fff7ed;color:#c2410c}
.podium{display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:12px;align-items:end;margin-top:16px}
.rank{border:1px solid var(--line);border-radius:17px;text-align:center;padding:16px;background:#fff;min-height:150px}
.rank.r1{min-height:188px;background:#fffaf0;border-color:#e9c75f}.rank.r2{border-color:#bcc6d3}.rank.r3{background:#fff9f5;border-color:#d8a17d}
.avatar{width:54px;height:54px;border-radius:50%;background:#eef3f8;display:flex;align-items:center;justify-content:center;margin:4px auto 8px;font-weight:900}
.rank .score{font-size:21px;font-weight:900;margin-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px}.tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.seat-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px}.seat{border:1px dashed #b8c5d5;border-radius:13px;padding:12px;background:#fff;min-height:70px}
.week-grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow:auto}.daycol{min-width:180px}.lesson{padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
.modal-back{position:fixed;inset:0;background:rgba(4,17,34,.46);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{width:min(920px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:18px}
.modal h3{margin-top:0}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.toast{position:fixed;right:20px;bottom:20px;background:#10233f;color:#fff;padding:11px 15px;border-radius:11px;z-index:200;box-shadow:var(--shadow)}
.footer{text-align:center;color:#7c8796;padding:24px 0 10px;font-size:13px}
.hidden{display:none!important}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:780px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;z-index:80;width:270px;transition:.2s}.sidebar.open{left:0}.hamb{display:inline-flex}
  .topbar{padding:0 12px}.content{padding:14px}.g4,.g3,.g2,.form-grid{grid-template-columns:1fr}.podium{grid-template-columns:1fr}.rank,.rank.r1{min-height:auto}
  .hero img{height:230px}.hero-title{font-size:22px}.seat-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}
}
@media print{.sidebar,.topbar,.no-print,.btn{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none}}
</style>

function loadState(){try{
  const s=JSON.parse(localStorage.getItem(KEY))||seed();
  if(!Array.isArray(s.tasks))s.tasks=[];
  ["scores","duty","weekly","finance","comments","messages","members"].forEach(k=>(s[k]||[]).forEach(x=>{if(typeof x.done==="undefined")x.done=false}));
  (s.incidents||[]).forEach(x=>{if(typeof x.resolved==="undefined")x.resolved=false});
  return s
}catch(e){return seed()}}
function save(msg="Đã lưu"){localStorage.setItem(KEY,JSON.stringify(state));log(msg);renderClassSelect(); if(msg) toast(msg)}
function log(action){state.logs=state.logs||[];state.logs.unshift({id:uid(),at:new Date().toISOString(),action});state.logs=state.logs.slice(0,500)}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function $(q){return document.querySelector(q)}
function $$(q){return [...document.querySelectorAll(q)]}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function todayISO(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getTimezoneOffset()/1440).toISOString().slice(0,10)}
function fmtDate(x){if(!x)return"";const [y,m,d]=String(x).slice(0,10).split("-");return `${d}/${m}/${y}`}
function fmtDT(x){if(!x)return"";return new Date(x).toLocaleString("vi-VN")}
function curClass(){return state.classes.find(x=>x.id===state.currentClassId)||state.classes[0]}
function classStudents(){return state.students.filter(x=>x.classId===state.currentClassId)}
function byClass(arr){return (arr||[]).filter(x=>x.classId===state.currentClassId)}
function initials(name){return String(name||"HS").trim().split(/\s+/).slice(-2).map(x=>x[0]||"").join("").toUpperCase().slice(0,2)}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function modal(html){$("#modalRoot").innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
function val(id){return document.getElementById(id)?.value??""}
function nval(id){return Number(val(id)||0)}
function currentYearLabel(){return curClass()?.year||""}

function navigate(p){
  page=p; $$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  $("#pageTitle").textContent=titles[p]?.[0]||"GVCN Pro";$("#pageSub").textContent=titles[p]?.[1]||"";
  render();
  if(innerWidth<780)$("#sidebar").classList.remove("open");
}

function refreshCurrentView(){
  try{
    renderClassSelect();
    render();
    requestAnimationFrame(()=>{
      try{
        renderClassSelect();
        render();
      }catch(err){console.error(err)}
    });
  }catch(err){
    console.error("Không thể cập nhật giao diện:",err);
  }
}

 classes:renderClasses,home:renderHome,students:renderStudents,seats:renderSeats,timetable:renderTimetable,scores:renderScores,
 discipline:renderDiscipline,duty:renderDuty,weekly:renderWeekly,tasks:renderTasks,finance:renderFinance,reports:renderReports,comments:renderComments,

}[page]||renderHome)()}

function renderClassSelect(){
  $("#classSelect").innerHTML=state.classes.map(c=>`<option value="${c.id}" ${c.id===state.currentClassId?"selected":""}>${esc(c.name)}</option>`).join("");
  updateSidebarClassIdentity();
}
function updateSidebarClassIdentity(){
  const c=curClass();
  const n=document.getElementById("sideClassName");
  const y=document.getElementById("sideClassYear");
  const m=document.getElementById("sideClassMotto");
  if(n)n.textContent=c?.name||"LỚP HỌC";
  if(y)y.textContent=c?.year||"";
  if(m)m.textContent=(c?.motto||"ĐOÀN KẾT • NỖ LỰC • TỎA SÁNG").toUpperCase();
}
$("#classSelect").addEventListener("change",e=>{state.currentClassId=e.target.value;localStorage.setItem(KEY,JSON.stringify(state));updateSidebarClassIdentity();render()})

function renderClasses(){

function toggleClassSetup(id){const c=state.classes.find(x=>x.id===id);if(!c)return;c.setupDone=!c.setupDone;localStorage.setItem(KEY,JSON.stringify(state));log("Đã cập nhật trạng thái lớp");localStorage.setItem(KEY,JSON.stringify(state));refreshCurrentView();toast("Đã cập nhật trạng thái lớp")}
function selectClass(id){state.currentClassId=id;save("Đã chuyển lớp");navigate("home")}
function openClassForm(id=""){const c=state.classes.find(x=>x.id===id)||{};
 modal(`<h3>${id?"Sửa lớp":"Thêm lớp"}</h3><div class=form-grid>
 <div class=field><label>Tên lớp</label><input id=fClassName value="${esc(c.name||"")}"></div>
 <div class=field><label>Trường</label><input id=fSchool value="${esc(c.school||"")}"></div>
 <div class=field><label>Năm học</label><input id=fYear value="${esc(c.year||"2026–2027")}"></div>
 <div class=field><label>Dòng tên / Khẩu hiệu lớp</label><input id=fMotto maxlength="60" placeholder="Ví dụ: CHUYẾN TÀU TUỔI TRẺ" value="${esc(c.motto||"")}"></div>
 </div><div class=modal-foot><button class=btn onclick=closeModal()>Hủy</button><button class="btn primary" onclick="saveClass('${id}')">Lưu</button></div>`) }
function saveClass(id){const name=val("fClassName").trim();if(!name)return toast("Nhập tên lớp");
 if(id){Object.assign(state.classes.find(x=>x.id===id),{name,school:val("fSchool"),year:val("fYear"),motto:val("fMotto").trim()})}
 else{const c={id:uid(),name,school:val("fSchool"),year:val("fYear"),motto:val("fMotto").trim(),cover:""};state.classes.push(c);state.currentClassId=c.id}

function getRankRange(){

 const iso=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getTimezoneOffset()/1440).toISOString().slice(0,10);
 const sy=()=>{const y=now.getFullYear(),m=now.getMonth()+1,s=m>=8?y:y-1;return{s,e:s+1}};
 if(rankFilter.mode==="today"){const x=iso(now);return{x1:x,x2:x,label:"Hôm nay"}}
 if(rankFilter.mode==="date"){const x=iso(date);return{x1:x,x2:x,label:"Ngày "+date.toLocaleDateString("vi-VN")}}
 if(rankFilter.mode==="week"){const s=new Date(now),d=(now.getDay()+6)%7;s.setDate(now.getDate()-d);const e=new Date(s);e.setDate(s.getDate()+6);return{x1:iso(s),x2:iso(e),label:s.toLocaleDateString("vi-VN")+" – "+e.toLocaleDateString("vi-VN")}}
 if(rankFilter.mode==="month"){const s=new Date(now.getFullYear(),now.getMonth(),1),e=new Date(now.getFullYear(),now.getMonth()+1,0);return{x1:iso(s),x2:iso(e),label:"Tháng "+(now.getMonth()+1)+"/"+now.getFullYear()}}
 const y=sy(); if(rankFilter.mode==="sem1")return{x1:`${y.s}-09-01`,x2:`${y.e}-01-15`,label:`Học kì 1 • ${y.s}–${y.e}`}
 if(rankFilter.mode==="sem2")return{x1:`${y.e}-01-16`,x2:`${y.e}-05-31`,label:`Học kì 2 • ${y.s}–${y.e}`}
 return{x1:`${y.s}-09-01`,x2:`${y.e}-05-31`,label:`Cả năm học • ${y.s}–${y.e}`};
}
function rankRows(){

 return classStudents().map(s=>{let o={s,present:0,late:0,excused:0,unexcused:0,violations:0,positive:0,score:Number(rules.base||0)};
  byClass(state.attendance).filter(x=>x.studentId===s.id&&x.date>=r.x1&&x.date<=r.x2).forEach(x=>{if(x.status==="Có mặt")o.present++;if(x.status==="Đi trễ"){o.late++;o.score+=Number(rules.late||0)}
   if(x.status==="Vắng phép"){o.excused++;o.score+=Number(rules.excused||0)}if(x.status==="Vắng không phép"){o.unexcused++;o.score+=Number(rules.unexcused||0)}if(x.status==="Về sớm")o.score+=Number(rules.early||0)});
  byClass(state.incidents).filter(x=>x.studentId===s.id&&x.date>=r.x1&&x.date<=r.x2).forEach(x=>{o.violations++;const lv=x.level||"Nhắc nhở";o.score+=lv==="Nghiêm trọng"?Number(rules.incidentSerious):lv==="Cần lưu ý"?Number(rules.incidentAttention):Number(rules.incidentReminder)});

  return o
 }).sort((a,b)=>b.score-a.score||b.positive-a.positive||a.violations-b.violations||a.s.name.localeCompare(b.s.name,"vi"))
}

function normalizeExcelHeader(v){
  return String(v??"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
}
function parseExcelDate(v){
  if(v==null||v==="")return "";
  if(typeof v==="number"){
    // Excel serial date, base 1899-12-30.
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    if(!isNaN(d))return d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const [y,m,d]=s.split("-");return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(s)){
    const [d,m,y]=s.split(/[\/\-]/);return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  return "";
}
function mapStudentExcelRow(row){
  const normalized={};
  Object.keys(row||{}).forEach(k=>normalized[normalizeExcelHeader(k)]=row[k]);
  const pick=(...keys)=>{
    for(const k of keys){
      const nk=normalizeExcelHeader(k);
      if(normalized[nk]!==undefined && normalized[nk]!==null && String(normalized[nk]).trim()!=="")return normalized[nk];
    }
    return "";
  };
  const name=String(pick("Họ và tên","Họ tên","Tên học sinh","HoTen","Name")).trim();
  if(!name)return null;
  return {
    name,
    gender:String(pick("Giới tính","GioiTinh","Gender")).trim(),
    dob:parseExcelDate(pick("Ngày sinh","NgaySinh","DOB")),
    group:String(pick("Tổ","To","Nhóm","Group")).trim(),
    phoneFather:String(pick("SĐT cha","SDT cha","Số điện thoại cha","PhoneFather")).trim(),
    phoneMother:String(pick("SĐT mẹ","SDT mẹ","Số điện thoại mẹ","PhoneMother")).trim()
  };
}
function u16(d,o){return d[o]|(d[o+1]<<8)}
function u32(d,o){return (d[o]|(d[o+1]<<8)|(d[o+2]<<16)|(d[o+3]<<24))>>>0}
async function unzipXlsx(arrayBuffer){
  const d=new Uint8Array(arrayBuffer);
  const td=new TextDecoder("utf-8");
  let eocd=-1;
  for(let i=d.length-22;i>=Math.max(0,d.length-66000);i--){
    if(u32(d,i)===0x06054b50){eocd=i;break}
  }
  if(eocd<0)throw new Error("Không tìm thấy cấu trúc XLSX.");
  const total=u16(d,eocd+10);
  let pos=u32(d,eocd+16);
  const files={};
  for(let n=0;n<total;n++){
    if(u32(d,pos)!==0x02014b50)throw new Error("File XLSX không hợp lệ.");
    const method=u16(d,pos+10), compSize=u32(d,pos+20), nameLen=u16(d,pos+28),
          extraLen=u16(d,pos+30), commentLen=u16(d,pos+32), localOff=u32(d,pos+42);
    const name=td.decode(d.slice(pos+46,pos+46+nameLen));
    const localNameLen=u16(d,localOff+26), localExtraLen=u16(d,localOff+28);
    const dataStart=localOff+30+localNameLen+localExtraLen;
    const compressed=d.slice(dataStart,dataStart+compSize);
    let bytes;
    if(method===0){
      bytes=compressed;
    }else if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("Trình duyệt chưa hỗ trợ giải nén XLSX.");
      const ds=new DecompressionStream("deflate-raw");
      const stream=new Blob([compressed]).stream().pipeThrough(ds);
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    }else{
      throw new Error("Định dạng nén XLSX chưa được hỗ trợ.");
    }
    files[name]=bytes;
    pos+=46+nameLen+extraLen+commentLen;
  }
  return files;
}
function xmlText(bytes){
  return new TextDecoder("utf-8").decode(bytes||new Uint8Array());
}
function getXmlTextNodes(node){
  return [...node.getElementsByTagName("t")].map(t=>t.textContent||"").join("");
}
async function readXlsxRows(file){
  const files=await unzipXlsx(await file.arrayBuffer());
  const parser=new DOMParser();

  let shared=[];
  if(files["xl/sharedStrings.xml"]){
    const doc=parser.parseFromString(xmlText(files["xl/sharedStrings.xml"]),"application/xml");
    shared=[...doc.getElementsByTagName("si")].map(si=>getXmlTextNodes(si));
  }

  // Resolve first worksheet path from workbook relationships.
  let sheetPath="xl/worksheets/sheet1.xml";
  if(files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]){
    const wdoc=parser.parseFromString(xmlText(files["xl/workbook.xml"]),"application/xml");
    const firstSheet=wdoc.getElementsByTagName("sheet")[0];
    const rid=firstSheet?.getAttribute("r:id")||firstSheet?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const rdoc=parser.parseFromString(xmlText(files["xl/_rels/workbook.xml.rels"]),"application/xml");
    const rel=[...rdoc.getElementsByTagName("Relationship")].find(r=>r.getAttribute("Id")===rid);
    let target=rel?.getAttribute("Target");
    if(target){
      target=target.replace(/\\/g,"/");
      if(target.startsWith("/"))sheetPath=target.slice(1);
      else if(target.startsWith("xl/"))sheetPath=target;
      else sheetPath="xl/"+target.replace(/^(\.\.\/)+/,"");
    }
  }
  const sheetBytes=files[sheetPath]||files["xl/worksheets/sheet1.xml"];
  if(!sheetBytes)throw new Error("Không tìm thấy sheet dữ liệu.");

  const sdoc=parser.parseFromString(xmlText(sheetBytes),"application/xml");
  const rows=[...sdoc.getElementsByTagName("row")];
  const grid=[];
  const colIndex=ref=>{
    const letters=String(ref||"").match(/[A-Z]+/i)?.[0]?.toUpperCase()||"A";
    let n=0; for(const ch of letters)n=n*26+(ch.charCodeAt(0)-64);
    return n-1;
  };
  for(const row of rows){
    const arr=[];
    for(const c of [...row.getElementsByTagName("c")]){
      const idx=colIndex(c.getAttribute("r"));
      const type=c.getAttribute("t")||"";
      const v=c.getElementsByTagName("v")[0]?.textContent??"";
      let value=v;
      if(type==="s")value=shared[Number(v)]??"";
      else if(type==="inlineStr")value=getXmlTextNodes(c);
      else if(type==="b")value=v==="1";
      else if(v!=="" && !isNaN(Number(v)))value=Number(v);
      arr[idx]=value;
    }
    grid.push(arr);
  }
  if(!grid.length)return [];
  const headers=grid[0].map(x=>String(x??"").trim());
  return grid.slice(1).map(r=>{
    const obj={};
    headers.forEach((hd,i)=>{if(hd)obj[hd]=r[i]??""});
    return obj;
  });
}
function parseCsvRows(text){
  const rows=[];
  let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'){
      if(q && next==='"'){cell+='"';i++} else q=!q;
    }else if(ch===','&&!q){row.push(cell);cell=""}
    else if((ch==='\n'||ch==='\r')&&!q){
      if(ch==='\r'&&next==='\n')i++;
      row.push(cell);cell="";
      if(row.some(x=>String(x).trim()!==""))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  row.push(cell); if(row.some(x=>String(x).trim()!==""))rows.push(row);
  if(!rows.length)return [];
  const headers=rows[0].map(x=>String(x??"").trim());
  return rows.slice(1).map(r=>{
    const o={};headers.forEach((hd,i)=>{if(hd)o[hd]=r[i]??""});return o;
  });
}
async function importStudentsExcel(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".xlsx,.csv";
  input.onchange=async()=>{
    const file=input.files?.[0];
    if(!file)return;
    try{
      let rows=[];
      if(file.name.toLowerCase().endsWith(".csv")){
        rows=parseCsvRows(await file.text());
      }else{
        rows=await readXlsxRows(file);
      }
      const mapped=rows.map(mapStudentExcelRow).filter(Boolean);
      if(!mapped.length){
        toast("Không tìm thấy học sinh. Kiểm tra cột 'Họ và tên' trong file.");
        return;
      }
      const existing=classStudents();
      const dupNames=new Set(existing.map(s=>String(s.name||"").trim().toLowerCase()));
      let added=0,skipped=0;
      mapped.forEach(s=>{
        const key=s.name.toLowerCase();
        if(dupNames.has(key)){skipped++;return}
        state.students.push({
          id:uid(),classId:state.currentClassId,
          name:s.name,gender:s.gender,dob:s.dob,group:s.group,
          phoneFather:s.phoneFather,phoneMother:s.phoneMother,seat:""
        });
        dupNames.add(key);added++;
      });
      save(`Đã nhập ${added} học sinh từ Excel`);
      renderStudents();
      if(skipped)toast(`Đã nhập ${added} học sinh, bỏ qua ${skipped} tên trùng.`);
    }catch(err){
      console.error(err);
      toast("Không đọc được file Excel này. Hãy dùng file .xlsx mẫu của app.");
    }
  };
  input.click();
}

function seatDragStart(e){
  const el=e.currentTarget;
  seatDragData={studentId:el.dataset.student||"",fromSeat:el.dataset.seat||""};
  if(e.dataTransfer)e.dataTransfer.setData("text/plain",JSON.stringify(seatDragData));

function seatDragOver(e){e.preventDefault();e.currentTarget.classList.add("drag-over")}

function toggleSeatDone(){curClass().seatDone=!curClass().seatDone;localStorage.setItem(KEY,JSON.stringify(state));log(curClass().seatDone?"Đã lưu sơ đồ chỗ ngồi":"Đã mở chỉnh sửa sơ đồ chỗ ngồi");localStorage.setItem(KEY,JSON.stringify(state));refreshCurrentView();toast(curClass().seatDone?"Đã lưu sơ đồ chỗ ngồi":"Đã mở chỉnh sửa sơ đồ")}
function seatDrop(e){
  if(curClass().seatDone){toast("Sơ đồ đã hoàn thành. Hãy mở lại để chỉnh sửa.");return}
  e.preventDefault(); e.currentTarget.classList.remove("drag-over");
  let data=seatDragData;
  try{if(e.dataTransfer?.getData("text/plain"))data=JSON.parse(e.dataTransfer.getData("text/plain"))}catch(_){}
  if(!data?.studentId)return;
  const targetSeat=e.currentTarget.dataset.seat;
  const targetStudentId=e.currentTarget.dataset.student||"";
  const moving=state.students.find(s=>s.id===data.studentId);
  if(!moving)return;
  const fromSeat=String(moving.seat||"");
  if(targetStudentId&&targetStudentId!==moving.id){
    const other=state.students.find(s=>s.id===targetStudentId);
    if(other)other.seat=fromSeat||"";
  }
  moving.seat=String(targetSeat);
  localStorage.setItem(KEY,JSON.stringify(state));
  log("Đã đổi chỗ ngồi");
  renderSeats();
  toast("Đã cập nhật chỗ ngồi");
}

function saveLesson(id=""){
  const day=val("lDay");
  const period=nval("lPeriod");
  const subject=val("lSubject").trim();
  if(!subject)return toast("Nhập môn học");

  const duplicate=byClass(state.timetable).find(x=>x.day===day&&Number(x.period)===period&&x.id!==id);
  if(duplicate){
    const ok=confirm(`Ô ${day} - Tiết ${period} đã có môn ${duplicate.subject}. Thay thế tiết này?`);
    if(!ok)return;
    state.timetable=state.timetable.filter(x=>x.id!==duplicate.id);
  }

  const data={day,period,subject,teacher:val("lTeacher").trim(),room:val("lRoom").trim(),time:val("lTime").trim()};

  if(id){
    const x=state.timetable.find(v=>v.id===id);
    if(x)Object.assign(x,data);
  }else{
    state.timetable.push({id:uid(),classId:state.currentClassId,...data});
  }

  if(data.time)timetablePeriodTimes[period]=data.time;
  closeModal();
  save(id?"Đã sửa tiết học":"Đã thêm tiết học");
  renderTimetable();
}

function toggleLessonDone(id){const x=state.timetable.find(v=>v.id===id);if(!x)return;x.done=!x.done;localStorage.setItem(KEY,JSON.stringify(state));log(x.done?"Đã xác nhận tiết học":"Đã mở lại tiết học");localStorage.setItem(KEY,JSON.stringify(state));refreshCurrentView();toast(x.done?"Đã xác nhận tiết học":"Đã mở lại tiết học")}
function deleteLesson(id,fromModal=false){
  const x=state.timetable.find(v=>v.id===id);
  if(!x)return;
  if(!confirm(`Xóa ${x.subject} - ${x.day} - Tiết ${x.period}?`))return;
  state.timetable=state.timetable.filter(v=>v.id!==id);
  if(fromModal)closeModal();
  save("Đã xóa tiết học");
  renderTimetable();
}

function clearTimetable(){
  const count=byClass(state.timetable).length;
  if(!count)return toast("Thời khóa biểu đang trống");
  if(!confirm(`Xóa toàn bộ ${count} tiết của lớp ${curClass().name}?`))return;
  state.timetable=state.timetable.filter(x=>x.classId!==state.currentClassId);
  save("Đã xóa toàn bộ thời khóa biểu");
  renderTimetable();
}

function concernMetrics(student){
  const atts=byClass(state.attendance).filter(x=>x.studentId===student.id);
  const late=atts.filter(x=>x.status==="Đi trễ").length;
  const unexcused=atts.filter(x=>x.status==="Vắng không phép").length;
  const excused=atts.filter(x=>x.status==="Vắng phép").length;
  const incidents=byClass(state.incidents).filter(x=>x.studentId===student.id&&!x.resolved).length;
  const r=rankRows().find(x=>x.s.id===student.id);
  const score=r?.score??0;
  const totalSessions=atts.length;
  const present=atts.filter(x=>x.status==="Có mặt"||x.status==="Đi trễ").length;
  const attendanceRate=totalSessions?Math.round((present/totalSessions)*100):100;
  const reasons=[];
  if(unexcused>0)reasons.push(`Vắng ${unexcused} buổi không phép`);
  if(late>=2)reasons.push(`Đi muộn ${late} lần`);
  if(score<0)reasons.push(`Điểm nề nếp âm (${score} điểm)`);
  if(incidents>0)reasons.push(`Có ${incidents} vi phạm`);
  return {student,late,unexcused,excused,incidents,score,attendanceRate,reasons};
}

function concernStudents(){
  return classStudents().map(concernMetrics).filter(x=>x.reasons.length>0).sort((a,b)=>{
    const riskA=(a.unexcused*5)+(a.late*2)+(a.incidents*3)+Math.max(0,-a.score);
    const riskB=(b.unexcused*5)+(b.late*2)+(b.incidents*3)+Math.max(0,-b.score);
    return riskB-riskA || a.student.name.localeCompare(b.student.name,"vi");
  });
}

    if(!x)return toast("Không tìm thấy dữ liệu chuyên cần");
    modal(`<h3>✏️ Sửa chuyên cần</h3>
      <div class=form-grid>
        <div class=field><label>Học sinh</label><input disabled value="${esc(state.students.find(s=>s.id===x.studentId)?.name||"")}"></div>

    modal(`<h3>✏️ Sửa ghi nhận vi phạm</h3>
      <div class=form-grid>

function manageConcernData(studentId){
  const s=state.students.find(x=>x.id===studentId); if(!s)return;
  const rows=[];
  byClass(state.attendance).filter(x=>x.studentId===studentId&&x.status&&x.status!=="Có mặt")
    .forEach(x=>rows.push({id:x.id,type:"Chuyên cần",date:x.date,text:x.status}));
  byClass(state.incidents).filter(x=>x.studentId===studentId)
    .forEach(x=>rows.push({id:x.id,type:"Vi phạm",date:x.date,text:`${x.level||"Nhắc nhở"}${x.note?": "+x.note:""}`}));
  byClass(state.positive).filter(x=>x.studentId===studentId)
    .forEach(x=>rows.push({id:x.id,type:"Tích cực",date:x.date,text:`+${x.points||0} điểm${x.note?": "+x.note:""}`}));
  rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  modal(`<h3>🛠️ Chỉnh dữ liệu cần quan tâm – ${esc(s.name)}</h3>

    </tbody></table></div>
    <div class=modal-foot><button class=btn onclick=closeModal()>Đóng</button></div>`);
}
function deleteConcernRecord(type,id,studentId){
  if(!confirm("Xóa ghi nhận này khỏi dữ liệu nề nếp?"))return;
  if(type==="Chuyên cần")state.attendance=state.attendance.filter(x=>x.id!==id);
  if(type==="Vi phạm")state.incidents=state.incidents.filter(x=>x.id!==id);

  save("Đã xóa dữ liệu cần quan tâm");

function taskPriorityRank(p){
  return p==="Gấp"?0:p==="Cao"?1:p==="Bình thường"?2:3;
}
function taskStatusLabel(x){
  if(x.done)return '<span class="badge good">✓ Hoàn thành</span>';
  const today=todayISO();
  if(x.dueDate && x.dueDate<today)return '<span class="badge bad">Quá hạn</span>';
  if(x.priority==="Gấp")return '<span class="badge bad">Gấp</span>';
  if(x.priority==="Cao")return '<span class="badge warn">Ưu tiên cao</span>';
  return '<span class="badge">Đang thực hiện</span>';
}
function taskDaysLeft(x){
  if(!x.dueDate)return "";
  const a=new Date(todayISO()+"T00:00:00"),b=new Date(x.dueDate+"T00:00:00");
  const d=Math.round((b-a)/86400000);
  if(x.done)return "Đã hoàn thành";
  if(d<0)return `Quá hạn ${Math.abs(d)} ngày`;
  if(d===0)return "Hạn hôm nay";
  if(d===1)return "Còn 1 ngày";
  return `Còn ${d} ngày`;
}
function sortedTasks(includeDone=true){
  let arr=byClass(state.tasks||[]);
  if(!includeDone)arr=arr.filter(x=>!x.done);
  return [...arr].sort((a,b)=>{
    if(!!a.done!==!!b.done)return a.done?1:-1;
    const da=a.dueDate||"9999-12-31",db=b.dueDate||"9999-12-31";
    return da.localeCompare(db)||taskPriorityRank(a.priority)-taskPriorityRank(b.priority)||String(a.title||"").localeCompare(String(b.title||""),"vi");
  });
}
function upcomingTasksHome(){
  const rows=sortedTasks(false).slice(0,5);
  if(!rows.length)return `<div class=empty style="padding:22px">Chưa có công việc sắp tới.</div>`;
  return rows.map(x=>`
    <div class="task-home-row">
      <div class=task-home-main>
        <div class=task-home-title>${esc(x.title)}</div>
        <div class=task-home-meta>${x.assignee?`Phụ trách: ${esc(x.assignee)} • `:""}${x.dueDate?`Hạn ${fmtDate(x.dueDate)}`:"Chưa đặt hạn"}</div>
      </div>
      <div class=task-home-side>${taskStatusLabel(x)}<div class="muted task-days">${esc(taskDaysLeft(x))}</div></div>
    </div>`).join("");
}

function saveTask(id=""){
  const title=val("tTitle").trim();
  if(!title)return toast("Nhập nội dung công việc");
  const data={
    title,
    dueDate:val("tDue"),
    priority:val("tPriority"),
    assignee:val("tAssignee").trim(),
    description:val("tDescription").trim(),
    done:val("tDone")==="1"
  };
  state.tasks=state.tasks||[];
  if(id){
    const x=state.tasks.find(v=>v.id===id);
    if(x)Object.assign(x,data);
  }else{
    state.tasks.push({id:uid(),classId:state.currentClassId,createdAt:new Date().toISOString(),...data});
  }
  closeModal();
  localStorage.setItem(KEY,JSON.stringify(state));
  log(id?"Đã sửa công việc":"Đã thêm công việc");
  localStorage.setItem(KEY,JSON.stringify(state));
  renderTasks();
  toast(id?"Đã lưu thay đổi":"Đã thêm công việc");
}

function toggleTaskDone(id){
  const x=(state.tasks||[]).find(v=>v.id===id);
  if(!x)return;
  x.done=!x.done;
  x.completedAt=x.done?new Date().toISOString():"";
  localStorage.setItem(KEY,JSON.stringify(state));
  log(x.done?"Đã hoàn thành công việc":"Đã mở lại công việc");
  localStorage.setItem(KEY,JSON.stringify(state));
  renderTasks();
  toast(x.done?"Đã hoàn thành":"Đã mở lại công việc");
}

function deleteTask(id,fromModal=false){
  const x=(state.tasks||[]).find(v=>v.id===id);
  if(!x)return;
  if(!confirm(`Xóa công việc "${x.title}"?`))return;
  state.tasks=state.tasks.filter(v=>v.id!==id);
  if(fromModal)closeModal();
  localStorage.setItem(KEY,JSON.stringify(state));
  log("Đã xóa công việc");
  localStorage.setItem(KEY,JSON.stringify(state));
  renderTasks();
  toast("Đã xóa công việc");
}

function getRaceAudio(){
  if(!raceAudioCtx){
    try{raceAudioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  }
  if(raceAudioCtx.state==="suspended")raceAudioCtx.resume();
  return raceAudioCtx;
}
function raceTone(freq,duration=.08,volume=.04,type="square",delay=0){
  if(!raceState.sound)return;
  const ctx=getRaceAudio();if(!ctx)return;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;
  gain.gain.setValueAtTime(.0001,ctx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+delay+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+duration+.02);
}
function raceStartSound(){
  [392,523,659].forEach((f,i)=>raceTone(f,.11,.045,"triangle",i*.12));
}
function raceEnginePulse(){
  if(!raceState.sound)return;
  for(let i=0;i<22;i++){
    raceTone(125+(i%5)*22,.055,.022,"sawtooth",i*.16);
  }
  [220,260,310,370].forEach((f,i)=>raceTone(f,.08,.024,"square",2.8+i*.12));
}
function raceFinishSound(){
  const notes=[[523,.0,.12],[659,.10,.12],[784,.20,.16],[1047,.34,.28],[784,.58,.10],[1047,.70,.30]];
  notes.forEach(([f,d,du])=>raceTone(f,du,.055,"triangle",d));
}

function raceCountdownStart(){
  return new Promise(resolve=>{
    const overlay=document.getElementById("raceCountdown");
    const num=document.getElementById("raceCountNumber");
    if(!overlay||!num){resolve();return}
    overlay.classList.add("show");
    let n=3;
    const show=()=>{
      num.textContent=n>0?String(n):"GO!";
      num.style.animation="none";void num.offsetWidth;num.style.animation="raceCountPop .65s ease both";
      raceTone(n>0?420+(3-n)*90:760,.12,.05,"triangle");
      if(n===0){
        setTimeout(()=>{overlay.classList.remove("show");resolve()},260);
      }else{
        n--;setTimeout(show,520);
      }
    };
    show();
  });
}

function resetRace(){
  if(raceRAF)cancelAnimationFrame(raceRAF);
  raceState.running=false;raceState.finished=false;raceState.winnerId="";raceState.positions={};
  document.getElementById("raceStage")?.classList.remove("racing");
  raceStudents().forEach(s=>document.getElementById("raceCar_"+s.id)?.classList.remove("race-moving","race-winning"));
  raceStudents().forEach(s=>raceState.positions[s.id]=0);
  renderRace();
  toast("Đã đưa tất cả xe về vạch xuất phát");
}




async function startRace(){
  const students=raceStudents();
  if(students.length<2){toast("Cần ít nhất 2 học sinh để bắt đầu");return}
  if(raceState.running)return;

  raceState.running=true;
  raceState.finished=false;
  raceState.winnerId="";
  raceState.positions={};
  students.forEach(s=>raceState.positions[s.id]=0);
  renderRace();

  await raceCountdownStart();

  const winner=students[Math.floor(Math.random()*students.length)];
  const winnerIndex=students.findIndex(s=>s.id===winner.id);
  const finishRanks=[...students.keys()].sort(()=>Math.random()-.5);
  const rankMap={};
  finishRanks.forEach((idx,rank)=>rankMap[students[idx].id]=rank);
  rankMap[winner.id]=0;

  const phase={};
  students.forEach((s,i)=>phase[s.id]=Math.random()*Math.PI*2);

  document.getElementById("raceStage")?.classList.add("racing");
  students.forEach(s=>document.getElementById("raceCar_"+s.id)?.classList.add("race-moving"));
  raceStartSound();
  raceEnginePulse();

  const started=performance.now();
  const duration=Math.max(3.8,Number(raceState.duration||5))*1000;

  function smooth(t){return t*t*(3-2*t)}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  function frame(now){
    const t=clamp((now-started)/duration,0,1);

    // Tất cả xe dùng cùng một tiến trình chính để luôn bám sát nhau.
    let common;
    if(t<.88){
      common=.92*smooth(t/.88);
    }else{
      common=.92+(.055*smooth((t-.88)/.12));
    }

    students.forEach((s,i)=>{
      const car=document.getElementById("raceCar_"+s.id);
      if(!car)return;
      // nhưng không cho xe nào tách quá xa khỏi đoàn.
      const wave=Math.sin(t*28+phase[s.id])*.010;
      const wave2=Math.sin(t*49+phase[s.id]*1.4)*.004;
      const rank=rankMap[s.id]||0;
      const finalGap=Math.min(.016,rank*.0012);

      let progress=common+wave+wave2;
      const settle=smooth(clamp((t-.72)/.28,0,1));
      const finalTarget=(s.id===winner.id)?1:(.992-finalGap);
      progress=progress*(1-settle)+finalTarget*settle;
      if(t<.96){
        progress=Math.min(progress,s.id===winner.id?.965:.958-finalGap*.4);
      }
      if(s.id===winner.id && t>=.96){
        progress=.965+(.035*smooth((t-.96)/.04));
      }
      if(s.id!==winner.id){
        progress=Math.min(progress,.992-finalGap);
      }

      progress=clamp(progress,0,1);
      raceState.positions[s.id]=progress;

      const travel=getRaceTravelDistance(s.id);
      car.style.transform=`translateX(${progress*travel}px)`;
    });

    if(t<1){
      raceRAF=requestAnimationFrame(frame);
      return;
    }

    const winCar=document.getElementById("raceCar_"+winner.id);
    if(winCar){
      const travel=getRaceTravelDistance(winner.id);
      winCar.style.transform=`translateX(${travel}px)`;
    }

    requestAnimationFrame(()=>{
      if(carHasTouchedFinish(winner.id)){
        finishRace(winner);
      }else{
        const pushUntilTouch=()=>{
          const wc=document.getElementById("raceCar_"+winner.id);
          if(!wc)return finishRace(winner);
          if(carHasTouchedFinish(winner.id))return finishRace(winner);
          const cur=parseFloat(wc.dataset.extraPush||"0")+2;
          wc.dataset.extraPush=String(cur);
          const travel=getRaceTravelDistance(winner.id);
          wc.style.transform=`translateX(${travel+cur}px)`;
          requestAnimationFrame(pushUntilTouch);
        };
        pushUntilTouch();
      }
    });
  }

  raceRAF=requestAnimationFrame(frame);
}

function getRaceTravelDistance(carId){
  const car=document.getElementById("raceCar_"+carId);
  const finish=document.querySelector(".finish-line");
  const track=car?.closest(".race-track");
  if(!car||!finish||!track)return 620;
  const finishLeft=finish.offsetLeft;
  const carLeft=car.offsetLeft;
  const carWidth=car.offsetWidth;
  return Math.max(80,finishLeft-carLeft-carWidth);
}
function calcFinishX(carId){return getRaceTravelDistance(carId)}

function carHasTouchedFinish(carId){
  const car=document.getElementById("raceCar_"+carId);
  const finish=document.querySelector(".finish-line");
  if(!car||!finish)return false;
  const c=car.getBoundingClientRect();
  const f=finish.getBoundingClientRect();
  return c.right >= f.left - 0.5;
}
function finishRace(winner){
  document.getElementById("raceStage")?.classList.remove("racing");
  raceStudents().forEach(s=>document.getElementById("raceCar_"+s.id)?.classList.remove("race-moving"));
  raceState.running=false;
  raceState.finished=true;
  raceState.winnerId=winner.id;
  raceState.positions[winner.id]=1;

  const car=document.getElementById("raceCar_"+winner.id);
  if(car){
    car.classList.add("race-winning");
  }

  const status=document.getElementById("raceStatusText");
  const short=document.getElementById("raceWinnerShort");
  if(status)status.textContent="Đã kết thúc";
  if(short)short.textContent=winner.name;

  raceState.history.unshift({
    id:uid(),studentId:winner.id,name:winner.name,
    className:curClass()?.name||"",
    time:new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})
  });
  raceState.history=raceState.history.slice(0,20);

  showRaceWinner(winner);
  raceFinishSound();
  launchConfetti();
}

function showRaceWinner(student){
  const overlay=document.getElementById("winnerOverlay");
  const name=document.getElementById("winnerOverlayName");
  const cls=document.getElementById("winnerOverlayClass");
  const kicker=overlay?.querySelector(".winner-kicker");
  if(!overlay||!student)return;
  if(kicker)kicker.textContent="🏆 XE BỨT PHÁ VỀ ĐÍCH 🏆";
  if(name)name.textContent=student.name||"";
  if(cls)cls.textContent=curClass()?.name||"";
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}

function closeWinnerOverlay(){
  const overlay=document.getElementById("winnerOverlay");
  if(!overlay)return;
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
}

function saveMember(id=""){state.members=state.members||[];const data={name:val("mbName").trim(),role:val("mbRole"),phone:val("mbPhone").trim()};if(!data.name)return toast("Nhập họ tên");if(id){const x=state.members.find(v=>v.id===id);if(x)Object.assign(x,data)}else state.members.push({id:uid(),done:true,...data});closeModal();save(id?"Đã sửa thành viên":"Đã thêm thành viên");renderMembers()}

function renderActivity(){
 $("#content").innerHTML=`<div class=section-head><div><h3>Lịch sử hoạt động</h3></div><button class=btn onclick="state.logs=[];localStorage.setItem(KEY,JSON.stringify(state));renderActivity()">Xóa lịch sử</button></div><div class=table-wrap><table><thead><tr><th>Thời gian</th><th>Hoạt động</th><th>Thao tác</th></tr></thead><tbody>${(state.logs||[]).map(x=>`<tr><td>${fmtDT(x.at)}</td><td>${esc(x.action)}</td><td><button class="btn sm bad" onclick="state.logs=state.logs.filter(v=>v.id!=='${x.id}');localStorage.setItem(KEY,JSON.stringify(state));renderActivity()">Xóa</button></td></tr>`).join("")||`<tr><td colspan=3 class=empty>Chưa có lịch sử.</td></tr>`}</tbody></table></div>`;
}

function renderData(){
 const cs=(window.GVCNCloud&&window.GVCNCloud.getStatus)?window.GVCNCloud.getStatus():{label:"Đang khởi tạo",detail:""};
 $("#content").innerHTML=`<div class="grid g2">
 <div class=card><h3 style="margin-top:0">💾 Sao lưu & phục hồi</h3><p class=muted>Xuất bản sao dự phòng hoặc phục hồi dữ liệu từ tệp JSON.</p><div class=actions><button class="btn primary" onclick=exportJSON()>Xuất sao lưu JSON</button><button class=btn onclick=importJSON()>Nhập sao lưu</button><button class="btn bad" onclick=resetAll()>Đặt lại toàn bộ</button></div></div>
 <div class=card><h3 style="margin-top:0">☁️ Đồng bộ Neon Cloud</h3><p class=muted>Dữ liệu được lưu qua Vercel API vào Neon PostgreSQL và dùng chung trên các thiết bị.</p><div id=cloudDataStatus class="cloud-data-status"><b>${esc(cs.label||"Đang khởi tạo")}</b><div class=muted style="margin-top:5px">${esc(cs.detail||"")}</div></div><div class=actions style="margin-top:12px"><button class="btn primary" onclick="window.GVCNCloud&&window.GVCNCloud.pushNow()">↑ Đồng bộ ngay</button><button class=btn onclick="window.GVCNCloud&&window.GVCNCloud.pullNow(true)">↓ Tải từ Cloud</button><button class=btn onclick="window.GVCNCloud&&window.GVCNCloud.refresh()">↻ Kiểm tra</button></div><div class=muted style="margin-top:10px">LocalStorage vẫn được giữ làm bộ nhớ đệm ngoại tuyến. Không lưu mật khẩu Neon trong trình duyệt.</div></div></div>`;
}
function exportJSON(){downloadBlob(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`GVCNPro_backup_${todayISO()}.json`)}
function importJSON(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{state=JSON.parse(e.target.result);localStorage.setItem(KEY,JSON.stringify(state));renderClassSelect();render();toast("Đã phục hồi dữ liệu")}catch(err){toast("File sao lưu không hợp lệ")}};r.readAsText(f)};i.click()}

function resetAll(){

  state=seed();
  localStorage.setItem(KEY,JSON.stringify(state));

function toggleSidebarGroup(title){
  const group=title?.closest(".group");
  if(!group)return;
  const groups=[...document.querySelectorAll(".sidebar .group")];
  const idx=groups.indexOf(group);
  group.classList.toggle("collapsed");
  const closed=group.classList.contains("collapsed");
  title.setAttribute("aria-expanded",closed?"false":"true");
  if(idx>=0)localStorage.setItem("GVCNPRO_MENU_GROUP_"+idx,closed?"closed":"open");
}

function setupCompactSidebar(){
  [...document.querySelectorAll(".sidebar .group")].forEach((g,i)=>{
    const title=g.querySelector(".group-title");
    if(!title)return;
    const saved=localStorage.getItem("GVCNPRO_MENU_GROUP_"+i);
    g.classList.toggle("collapsed", saved==="closed");
    title.setAttribute("aria-expanded",g.classList.contains("collapsed")?"false":"true");
    title.onclick=()=>toggleSidebarGroup(title);
    title.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        toggleSidebarGroup(title);
      }
    };
  });
}

async function callAPI(body){const s=state.sync||{};if(!s.url)throw new Error("Chưa nhập Web App URL");const r=await fetch(s.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,apiKey:s.apiKey||""})});return await r.json()}

async function pullSync(){try{const x=await callAPI({action:"pull",classId:state.currentClassId});if(!x.ok)throw new Error(x.message||"Không tải được dữ liệu");const incoming=x.data?.data||x.data;if(incoming&&incoming.classes){const keep=state.sync;state=incoming;state.sync={...(state.sync||{}),...keep,lastSync:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(state));renderClassSelect();navigate("home");toast("Đã tải dữ liệu")}else toast("Không có dữ liệu phù hợp")}catch(e){toast(e.message)}}

<!-- Neon Cloud Sync V2: timeout + mobile loop fix -->
<script id="gvcn-neon-cloud-sync">
(()=>{
  const API='/api/sync';
  const SNAPSHOT_ID='gvcn-main';
  const META_KEY='GVCN_NEON_SYNC_META_V1';
  const originalSetItem=Storage.prototype.setItem;
  const hadLocalDataAtBoot=!!localStorage.getItem(KEY);
  let suppress=false;
  let initialized=false;
  let pushTimer=null;
  let pushing=false;
  let pulling=false;
  let lastSerialized='';
  let lastRemoteUpdatedAt='';
  let status={state:'waiting',label:'☁ Chờ Cloud',detail:'Đang kiểm tra dữ liệu Neon...'};

  function safeMeta(){
    try{return JSON.parse(localStorage.getItem(META_KEY)||'{}')}catch(e){return{}}
  }
  function saveMeta(extra={}){
    const m={...safeMeta(),...extra};
    originalSetItem.call(localStorage,META_KEY,JSON.stringify(m));
    return m;
  }
  function fmt(ts){
    if(!ts)return 'Chưa có';
    try{return new Date(ts).toLocaleString('vi-VN')}catch(e){return String(ts)}
  }
  function setStatus(st,label,detail=''){
    status={state:st,label,detail};
    const el=document.getElementById('cloudSyncStatus');
    if(el){el.dataset.state=st;el.textContent=label;el.title=(detail||label)+' • Nhấn để kiểm tra Cloud'}
    const box=document.getElementById('cloudDataStatus');
    if(box){box.innerHTML=`<b>${esc(label)}</b><div class="muted" style="margin-top:5px">${esc(detail)}</div>`}
  }
  function ensurePill(){
    if(document.getElementById('cloudSyncStatus'))return;
    const actions=document.querySelector('.topbar>.actions');
    if(!actions)return;
    const el=document.createElement('span');
    el.id='cloudSyncStatus';el.className='cloud-sync-pill';el.dataset.state=status.state;el.textContent=status.label;el.title=(status.detail||status.label)+' • Nhấn để kiểm tra Cloud';
    el.style.cursor='pointer';
    el.addEventListener('click',()=>{if(initialized&&!pulling&&!pushing)pullNow(true)});
    actions.insertBefore(el,actions.firstChild);
  }
  function persistLocal(){
    suppress=true;
    try{originalSetItem.call(localStorage,KEY,JSON.stringify(state))}finally{suppress=false}
  }
  function renderAllAfterCloud(){
    try{renderClassSelect()}catch(e){}
    try{updateSidebarClassIdentity()}catch(e){}
    try{render()}catch(e){try{navigate(page||'home')}catch(_){}}
  }
  function isValidCloudData(data){return !!(data&&typeof data==='object'&&Array.isArray(data.classes)&&Array.isArray(data.students))}

  async function fetchWithTimeout(url,options={},timeoutMs=10000){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      return await fetch(url,{...options,signal:controller.signal});
    }catch(e){
      if(e&&e.name==='AbortError')throw new Error('Cloud phản hồi quá 10 giây');
      throw e;
    }finally{clearTimeout(timer)}
  }

  async function getRemote(){
    const r=await fetchWithTimeout(API,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'},10000);
    if(!r.ok)throw new Error(`Cloud GET ${r.status}`);
    const x=await r.json();
    if(!x.ok)throw new Error(x.error||'Không đọc được Cloud');
    return x;
  }

  async function postRemote(snapshot){
    const r=await fetchWithTimeout(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)},10000);
    if(!r.ok)throw new Error(`Cloud POST ${r.status}`);
    const x=await r.json();
    if(!x.ok)throw new Error(x.error||'Không ghi được Cloud');
    return x;
  }

  async function pushNow(showToast=false){
    if(pushing||pulling)return;
    if(!navigator.onLine){setStatus('offline','● Ngoại tuyến','Dữ liệu đang được giữ trên máy; sẽ đồng bộ khi có mạng.');return}
    pushing=true;
    clearTimeout(pushTimer);
    setStatus('syncing','● Đang đồng bộ','Đang gửi thay đổi lên Neon...');
    try{
      const payload=JSON.parse(JSON.stringify(state));
      await postRemote(payload);
      lastSerialized=JSON.stringify(state);
      const check=await getRemote();
      lastRemoteUpdatedAt=check.updatedAt||new Date().toISOString();
      saveMeta({lastSync:lastRemoteUpdatedAt,lastDirection:'push'});
      setStatus('ok','● Đã đồng bộ',`Lần cuối: ${fmt(lastRemoteUpdatedAt)}`);
      if(showToast)toast('Đã đồng bộ dữ liệu lên Cloud');
    }catch(e){
      console.error('[Neon Sync] push',e);
      setStatus(navigator.onLine?'error':'offline',navigator.onLine?'● Lỗi đồng bộ':'● Ngoại tuyến',e.message||'Không thể kết nối Cloud');
      if(showToast)toast('Không thể đồng bộ Cloud');
    }finally{pushing=false}
  }

  function schedulePush(delay=650){
    if(!initialized||suppress)return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>pushNow(false),delay);
  }

  async function pullNow(force=false){
    if(pulling||pushing)return;
    if(!navigator.onLine){setStatus('offline','● Ngoại tuyến','Không thể tải dữ liệu Cloud khi mất mạng.');return}
    pulling=true;
    setStatus('syncing','● Đang tải Cloud','Đang kiểm tra phiên bản mới nhất...');
    try{
      const x=await getRemote();
      const incoming=x.data;
      if(isValidCloudData(incoming)){
        const localChanged=JSON.stringify(state)!==lastSerialized;
        if(force||!localChanged||!initialized){
          suppress=true;
          try{
            state=incoming;
            persistLocal();
            lastSerialized=JSON.stringify(state);
            lastRemoteUpdatedAt=x.updatedAt||'';
            saveMeta({lastSync:lastRemoteUpdatedAt,lastDirection:'pull'});
          }finally{suppress=false}
          renderAllAfterCloud();
          setStatus('ok','● Đã đồng bộ',`Đã tải từ Cloud • ${fmt(lastRemoteUpdatedAt)}`);
          if(force)toast('Đã tải dữ liệu mới nhất từ Cloud');
        }else{
          setStatus('waiting','● Có thay đổi cục bộ','Đang ưu tiên thay đổi trên máy này; sẽ đẩy lên Cloud.');
          schedulePush(150);
        }
      }else{
        setStatus('waiting','● Cloud chưa có dữ liệu','Mở app trên máy đang có dữ liệu chính để khởi tạo Cloud.');
      }
    }catch(e){
      console.error('[Neon Sync] pull',e);
      setStatus(navigator.onLine?'error':'offline',navigator.onLine?'● Lỗi Cloud':'● Ngoại tuyến',e.message||'Không thể đọc Cloud');
    }finally{pulling=false}
  }

  async function bootstrap(){
    ensurePill();
    if(!navigator.onLine){initialized=true;lastSerialized=JSON.stringify(state);setStatus('offline','● Ngoại tuyến','Đang dùng dữ liệu lưu trên thiết bị.');return}
    setStatus('syncing','● Kết nối Cloud','Đang kiểm tra Neon...');
    try{
      const x=await getRemote();
      if(isValidCloudData(x.data)){
        suppress=true;
        try{
          state=x.data;
          persistLocal();
          lastSerialized=JSON.stringify(state);
          lastRemoteUpdatedAt=x.updatedAt||'';
          saveMeta({lastSync:lastRemoteUpdatedAt,lastDirection:'pull'});
        }finally{suppress=false}
        renderAllAfterCloud();
        initialized=true;
        setStatus('ok','● Đã đồng bộ',`Dữ liệu Cloud: ${fmt(lastRemoteUpdatedAt)}`);
      }else if(hadLocalDataAtBoot){
        initialized=true;
        lastSerialized=JSON.stringify(state);
        setStatus('syncing','● Khởi tạo Cloud','Đang đưa dữ liệu hiện có trên máy này lên Neon...');
        await pushNow(false);
      }else{
        initialized=true;
        lastSerialized=JSON.stringify(state);
        setStatus('waiting','● Cloud chưa có dữ liệu','Không tự đưa dữ liệu mẫu lên Cloud. Hãy mở app trên máy đang có dữ liệu chính trước.');
      }
    }catch(e){
      initialized=true;lastSerialized=JSON.stringify(state);
      console.error('[Neon Sync] bootstrap',e);
      setStatus('error','● Lỗi Cloud',e.message||'Không kết nối được Neon');
    }
  }

  // Bắt mọi thao tác hiện có đang lưu KEY vào localStorage mà không cần sửa từng chức năng.
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(this===localStorage&&key===KEY&&!suppress)schedulePush();
  };

  // Lưới an toàn: nếu một chức năng thay state nhưng quên gọi localStorage, vẫn phát hiện và đồng bộ.
  setInterval(()=>{
    if(!initialized||suppress||pushing||pulling)return;
    let now='';
    try{now=JSON.stringify(state)}catch(e){return}
    if(now!==lastSerialized){
      persistLocal();
      schedulePush(250);
    }
  },2200);

  // Không tự tải lại mỗi lần focus/đổi tab để tránh vòng lặp trên điện thoại.
  // Chỉ kiểm tra lại khi mạng vừa khôi phục và định kỳ nhẹ khi app đang mở.
  let lastAutoPullAt=0;
  async function autoPullIfDue(){
    const now=Date.now();
    if(!initialized||!navigator.onLine||pulling||pushing||document.hidden)return;
    if(now-lastAutoPullAt<60000)return;
    lastAutoPullAt=now;
    await pullNow(false);
  }
  window.addEventListener('online',()=>{setStatus('syncing','● Có mạng trở lại','Đang kiểm tra Cloud...');setTimeout(autoPullIfDue,500)});
  window.addEventListener('offline',()=>setStatus('offline','● Ngoại tuyến','Dữ liệu vẫn được lưu trên thiết bị.'));
  setInterval(autoPullIfDue,60000);

  window.GVCNCloud={
    pushNow:()=>pushNow(true),
    pullNow:(force=true)=>pullNow(force),
    refresh:()=>pullNow(false),
    getStatus:()=>({...status,lastRemoteUpdatedAt,SNAPSHOT_ID})
  };

  // Đợi giao diện chính vẽ xong rồi khởi tạo Cloud.
  setTimeout(bootstrap,80);
})();
</script>
</body>
</html>
